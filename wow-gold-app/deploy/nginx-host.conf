# ─────────────────────────────────────────────────────────────────────────────
# Nginx hôte — Reverse proxy pour gold.glatek.cloud
# Fichier à placer sur le serveur : /etc/nginx/sites-available/gold.glatek.cloud
# Puis : sudo ln -s /etc/nginx/sites-available/gold.glatek.cloud \
#                   /etc/nginx/sites-enabled/gold.glatek.cloud
# ─────────────────────────────────────────────────────────────────────────────

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gold.glatek.cloud;

    # Nécessaire pour que Certbot puisse renouveler le certificat
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + Reverse Proxy + Basic Auth
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gold.glatek.cloud;

    # ── Certificat Let's Encrypt ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/gold.glatek.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gold.glatek.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité TLS ─────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Headers de sécurité ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://wow.zamimg.com https://render.worldofwarcraft.com;" always;

    server_tokens off;

    # ── Authentification Basic ────────────────────────────────────────────────
    # Fichier .htpasswd généré par le script setup.sh
    auth_basic           "GoldMaster — Accès restreint";
    auth_basic_user_file /etc/nginx/.htpasswd-goldmaster;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/goldmaster.access.log;
    error_log  /var/log/nginx/goldmaster.error.log;

    # ── Proxy vers le conteneur Docker ───────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Pas de buffering pour les assets statiques
        proxy_buffering off;
    }

    # Health check (sans auth pour les sondes)
    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }
}
