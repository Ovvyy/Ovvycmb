name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust checks ──────────────────────────────────────────────────────────────
  rust-check:
    name: Rust Check & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (check only)
        run: cargo check --all

  rust-test:
    name: Rust Tests
    runs-on: windows-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all --no-fail-fast

  # ── Frontend checks ──────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter desktop typecheck

      - name: Lint
        run: pnpm --filter desktop lint

  # ── Security audit ───────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: cargo audit

  # ── Build release ────────────────────────────────────────────────────────────
  build-release:
    name: Build Release (Windows)
    runs-on: windows-latest
    needs: [rust-test, frontend-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build daemon
        run: cargo build --release --bin ovvycmb-daemon

      - name: Build overlay
        run: cargo build --release --bin ovvycmb-overlay

      - name: Build Tauri app
        run: pnpm --filter desktop build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ovvycmb-windows
          path: |
            target/release/ovvycmb-daemon.exe
            target/release/ovvycmb-overlay.exe
            apps/desktop/src-tauri/target/release/bundle/
          retention-days: 30
